name: Run tests

on:
  push:
    branches:
      - main
      - dajustp/add-gh-action-tests
    paths-ignore: [ '**.md' ]
  pull_request:
    branches:
      - main
      - dajustp/add-gh-action-tests
    paths-ignore: [ '**.md' ]

env:
  AzureWebJobsStorage: UseDevelopmentStorage=true


jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        submodules: true

    - name: 'Install .NET 3.1'
      run: |
          Import-Module ".\pipelineUtilities.psm1" -Force
          Install-Dotnet

    - name: 'Build'
      run: ./build.ps1 -Configuration Release -SkipExternalHelp

    # Install Azurite
    - name: Set up Node.js (needed for Azurite)
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        node-version: '22.x' # Azurite requires Node 21 or later

    - name: Install Azurite
      run: npm install -g azurite
      env:
        NPM_CONFIG_LOGLEVEL: verbose

    - name: Install Azure Functions Core Tools
      run: choco install azure-functions-core-tools --yes --no-progress

    - name: Run E2E tests
      run: azurite --skipApiVersionCheck --silent --blobPort 10000 --queuePort 10001 --tablePort 10002 & ./test/E2E/Start-E2ETest.ps1 -NoBuild -SkipCoreToolsDownload
